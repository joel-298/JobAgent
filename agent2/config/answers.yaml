profile:
  # "How many years of experience do you have with <tech>?"  (tech from tech_keywords)
  experience_years_with_tech: 1
  # "How many years of (total/work/professional) experience do you have?"
  total_experience_years: 1

  # "Where are you currently located?" / "Current location" / "City"
  location: Chandigarh

  # "Are you willing to relocate?" / "comfortable with ... location" etc.
  willing_to_relocate: "Yes"

  # Notice period / joining: text fields get notice_period, number fields get
  # notice_period_days, dropdowns/radios pick the closest option (Immediate, 0, <15 days...).
  notice_period: Immediate joiner
  notice_period_days: 0

  # Salary. Per-year amount in INR; the agent converts to LPA / per month
  # when the question asks for that, e.g. "Expected CTC (in LPA)" -> 7
  current_salary_per_year: 700000
  expected_salary_per_year: 700000

  # Generic Yes/No questions (authorised to work, can start immediately,
  # comfortable with shifts, have a degree, ...): answer Yes when the question
  # matches any of these words and the options are Yes/No.
  yes_to:
    - authorized
    - authorised
    - eligible
    - legally
    - comfortable
    - available
    - immediate
    - bachelor
    - degree
    - background check
    - drug test
    - immediately
    - join immediately

