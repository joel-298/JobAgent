summary: >-
  Full-Stack Software Engineer with 1+ years of experience building web applications, currently working as an SDE on
  live logistics systems. Built an associate program that has processed over $1.15M in order value across 1,500+ orders,
  cut an order page load from 2 minutes to ~1 second, and shipped features end-to-end across quote/order management,
